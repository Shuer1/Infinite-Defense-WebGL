<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | InfiniteDefense</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <!-- AdSense for Games：测试模式 -->
  <script async
          data-adbreak-test="on"
          src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1234567890123456"
          crossorigin="anonymous"></script>

  <!-- 初始化 adBreak 函数 -->
  <script>
    window.adsbygoogle = window.adsbygoogle || [];
    const adBreak = adConfig = function(o) { adsbygoogle.push(o); };
  </script>
</head>

<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width="1080" height="1920" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"></div>
    <div id="unity-footer">
      <div id="unity-webgl-logo"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">InfiniteDefense</div>
    </div>
  </div>

  <script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var fullscreenButton = document.querySelector("#unity-fullscreen-button");
    var warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type === 'error') div.style = 'background: red; padding: 10px;';
      else if (type === 'warning') div.style = 'background: yellow; padding: 10px;';
      else div.style = 'background: #eee; padding: 10px;';
      setTimeout(function () {
        warningBanner.removeChild(div);
        updateBannerVisibility();
      }, 5000);
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/WebGL.loader.js";
    var config = {
      dataUrl: buildUrl + "/WebGL.data",
      frameworkUrl: buildUrl + "/WebGL.framework.js",
      codeUrl: buildUrl + "/WebGL.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "aalokbright",
      productName: "InfiniteDefense",
      productVersion: "1.1.2",
      showBanner: unityShowBanner,
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
      container.className = "unity-mobile";
      canvas.className = "unity-mobile";
    } else {
      canvas.style.width = "1080px";
      canvas.style.height = "1920px";
    }

    loadingBar.style.display = "block";

    /* ================= 广告相关 ================= */
    function showOpenAd() {
      console.log('[ADS] 调用开屏广告');
      adBreak({
        type: 'start',
        name: 'open-ad',
        beforeAd: () => { canvas.style.visibility = 'hidden'; },
        afterAd:  () => { canvas.style.visibility = 'visible'; },
        adBreakDone: (info) => {
          console.log('[ADS] 开屏广告结果：', info.breakType, info.error || 'ok');
        }
      });
    }

    // 供 Unity 调用的激励广告
    function ShowRewardedAd() {
      adBreak({
        type: 'reward',
        name: 'rewarded-coin',
        beforeAd: () => {
          unityInstance.SendMessage('AdsManager', 'OnRewardedAdStarted');
        },
        adBreakDone: (info) => {
          if (!info.error) {
            unityInstance.SendMessage('AdsManager', 'OnRewardedAdCompleted');
          } else {
            unityInstance.SendMessage('AdsManager', 'OnRewardedAdFailed', info.error);
          }
        }
      });
    }
    /* =========================================== */

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = (100 * progress) + '%';
      }).then((unityInstance) => {
        loadingBar.style.display = "none";
        fullscreenButton.onclick = () => { unityInstance.SetFullscreen(1); };

        // 游戏加载完 → 开屏广告
        showOpenAd();
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
